name: Daily job watcher

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Fetch boards and build data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m job_watcher.pipeline
      - name: Commit daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/details.json data/status.json
          git diff --cached --quiet || git commit -m "data: daily job snapshot $(date -u +%F)"
          git push
